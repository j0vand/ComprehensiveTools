name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          # 本仓库无 package.json 依赖树，关闭默认包管理器缓存，避免误扫。
          package-manager-cache: false

      - name: Run tests
        run: node --test

      - name: Check JavaScript syntax
        run: find . -path './.git' -prune -o -path './node_modules' -prune -o -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Install browser test runtime
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/comprehensive-tools-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:8000/index.html > /dev/null && break
            sleep 1
          done
          SITE_BASE_URL=http://127.0.0.1:8000 npx playwright test browser-tests/site-smoke.spec.js --browser=chromium --workers=1 --forbid-only --fail-on-flaky-tests

  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # GitHub Pages 上传的是整个仓库，会把测试、文档和 uni-app 脚手架一并公开到站点 URL 下。
      # 这些都不属于站点内容，发布前去掉；rm -f/-rf 对不存在的路径不会失败。
      - name: Strip development-only files from the artifact
        run: |
          rm -rf tests browser-tests docs node_modules
          rm -f App.vue main.js manifest.json pages.json uni.scss uni.promisify.adaptor.js styles.css
          rm -rf pages/index

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
