<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订餐安排查看器</title>
    <link rel="icon" href="../../static/logo.png" type="image/png">
    <link rel="stylesheet" href="../../css/base.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/tool-layout.css">
    <style>
        :root {
            --primary-color: #0f9f8f;
            --primary-hover: #0b8176;
            --background-color: #f6fbf8;
            --card-background: rgba(255, 255, 255, 0.94);
            --text-color: #16302b;
            --text-muted: #667c76;
            --border-color: #dbe9e5;
            --radius-large: 16px;
            --radius-sm: 10px;
            --shadow-soft: 0 10px 28px rgba(24, 78, 68, 0.08);
            --font-heading: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            font-family: var(--font-body);
            margin: 0;
            padding: 16px;
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .back-to-home {
            color: var(--primary-color);
            text-decoration: none;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
        }

        .card {
            background: var(--card-background);
            border-radius: var(--radius-large);
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-soft);
            border: 1px solid #fff;
        }

        h2 {
            font-family: var(--font-heading);
            font-size: 1.5rem;
            color: var(--primary-color);
            margin-bottom: 16px;
            border-bottom: 2px dashed var(--border-color);
            padding-bottom: 8px;
        }

        .meal-input {
            width: 100%;
            height: 100px;
            margin-bottom: 16px;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 1rem;
            font-family: var(--font-body);
            resize: vertical;
            background-color: var(--card-background);
            transition: all 0.2s ease;
        }

        .meal-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(15, 159, 143, 0.16);
        }

        .button {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px; /* 大圆角按钮 */
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            width: 100%;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(15, 159, 143, 0.2);
        }

        .button:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .button:active {
            transform: translateY(1px);
        }

        .meal-card {
            border-left: 4px solid var(--primary-color);
            margin-bottom: 12px;
            padding: 12px 16px;
            background: #f9fafb;
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            position: relative;
            transition: transform 0.2s ease;
        }

        .meal-card:hover {
            transform: translateX(4px);
        }

        .meal-content {
            font-size: 0.95rem;
            line-height: 1.5;
            color: var(--text-color);
        }

        .today-meals {
            background: #fff;
            border: 2px solid var(--border-color);
        }

        #todayMeals {
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .clear-button {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            margin-top: 12px;
            box-shadow: none;
        }

        .clear-button:hover {
            background: #fee2e2;
            color: #ef4444;
            border-color: #fca5a5;
        }

        .today-date {
            font-family: var(--font-heading);
            font-size: 1.2rem;
            color: var(--primary-color);
            font-weight: bold;
            padding-bottom: 8px;
            border-bottom: 1px dashed var(--border-color);
            margin-bottom: 12px;
        }

        .meal-item {
            background: #f9fafb;
            border-radius: var(--radius-sm);
            padding: 16px;
            margin: 8px 0;
            border: 1px solid var(--border-color);
        }

        .meal-number {
            color: #ef4444;
            font-weight: bold;
            font-size: 24px;
            margin-right: 4px;
            font-family: var(--font-heading);
        }
        
        /* 覆盖内联样式 */
        .owner-options span, .quick-add-section label {
            color: var(--text-color) !important;
        }
        
        .save-options .hint-box {
            background-color: #f9fafb !important;
            border-left: 3px solid var(--primary-color) !important;
            color: var(--text-muted) !important;
        }
    </style>
</head>
<body class="tool-page">
    <div class="container tool-page-shell">
        <div class="tool-page-nav">
            <a href="../../index.html" class="back-to-home">
                ← 返回主页
            </a>
        </div>
        <div class="card today-meals">
            <h2>今日餐点</h2>
            <div id="todayMeals">
                <!-- 今日餐点将在这里显示 -->
            </div>
        </div>

        <div class="card">
            <h2>录入订餐安排</h2>
            <div class="owner-options" style="margin-bottom: 12px;">
                <span style="font-weight: bold; color: #333; margin-right: 8px;">记录归属:</span>
                <label style="margin-right: 16px;"><input type="radio" name="mealOwner" value="mine" checked> 我的</label>
                <label><input type="radio" name="mealOwner" value="others"> 他人</label>
            </div>
            <textarea class="meal-input" id="mealInput" placeholder="粘贴订餐安排..."></textarea>
            
            <div class="quick-add-section" style="margin-top: 16px; margin-bottom: 16px;">
                <label for="quickMealNumbers" style="display: block; font-weight: bold; color: #333; margin-bottom: 8px;">快捷录入序号 (仅晚餐)</label>
                <input type="text" id="quickMealNumbers" class="meal-input" style="height: auto; padding: 10px;" placeholder="输入序号，用空格或逗号分隔...">
                <div style="font-size: 12px; color: #666; margin-top: 4px;">将从明天(或下周一)开始，按天自动分配为“他人”的晚餐。</div>
            </div>

            <div class="save-options" style="margin-bottom: 12px;">
                <div id="weekDetectHint" style="display: none; font-size: 14px; font-weight: bold; padding: 8px 12px; border-radius: var(--radius-sm); background: #f0fdf4; margin-bottom: 8px;"></div>
                <div class="hint-box" style="font-size: 12px; padding: 12px; border-radius: var(--radius-sm);">
                    <b>提示:</b> 系统会根据粘贴内容头部的日期范围（如"4月13日-4月17日"），自动判断是本周还是下周的记录，无需手动选择。
                </div>
            </div>
            <button type="button" class="button" id="save-meal-btn">保存安排</button>
            <button type="button" class="button clear-button" id="clear-meal-btn">清除所有安排</button>
        </div>

        <div class="card">
            <h2>订餐安排</h2>
            <div id="mealHistory"></div>
        </div>
    </div>

    <script src="../../utils/storage-keys.js"></script>
    <script src="../../utils/common.js"></script>
    <script src="../../utils/storage-service.js"></script>
    <script src="../../utils/dialog.js"></script>
    <script src="mealViewer.js"></script>
</body>
</html>
