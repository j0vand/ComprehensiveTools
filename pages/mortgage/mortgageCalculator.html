<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>房贷计算器</title>
    <link rel="icon" href="../../static/logo.png" type="image/png">
    <link rel="stylesheet" href="../../css/base.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/tool-layout.css">
    <link rel="stylesheet" href="../pension-calculator/style.css">
    <style>
        .input-card, .result-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .loan-type-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            margin-bottom: 20px;
        }

        .loan-type-button {
            flex: 1;
            padding: 10px 5px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            background: var(--secondary-bg);
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .loan-type-button.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .input-addon {
            position: relative;
        }

        .input-group.error .input-field {
            border-color: var(--danger-color);
        }

        .input-addon:after {
            content: attr(data-unit);
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-sub);
            font-size: 0.9rem;
            pointer-events: none;
        }

        .calculate-button {
            width: 100%;
            min-height: 44px;
            padding: 12px 16px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .calculate-button:hover {
            background: var(--primary-hover);
        }

        .result-summary {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 30px;
        }

        .result-item {
            background: linear-gradient(180deg, #ffffff, #f4fbf9);
            padding: 15px;
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .result-label {
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        .result-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-color);
            margin-top: 5px;
            font-family: monospace;
        }

        .table-container {
            overflow-x: auto;
            margin: 0 -20px;
            padding: 0 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 0.9rem;
        }

        th, td {
            padding: 10px 8px;
            text-align: right;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-main);
        }

        th {
            background: var(--primary-color);
            color: white;
            font-weight: 600;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        tr:nth-child(even) {
            background-color: var(--secondary-bg);
        }

        tr:hover {
            background-color: #e3f2fd;
        }

        .chart-container {
            height: 250px;
            margin: 15px -20px 0;
            padding: 0 20px;
        }

        .tab-container {
            margin-top: 20px;
        }

        .tab-buttons {
            display: flex;
            gap: 5px;
            margin-bottom: 20px;
        }

        .tab-button {
            padding: 10px 15px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            background: var(--secondary-bg);
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .tab-button.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        @media (max-width: 768px) {
            .input-card,
            .result-card {
                padding: 15px;
            }

            .table-container,
            .chart-container {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
                margin: 0 -15px;
                padding: 0 15px;
            }

            .schedule-table {
                min-width: 500px;
            }

            #paymentChart {
                height: 250px !important;
            }

            .loan-type-button,
            .tab-button {
                font-size: 13px;
                padding: 8px 12px;
            }

            .input-group label {
                font-size: 14px;
            }

            .input-group input,
            .input-group select {
                font-size: 16px;
            }

            .result-item {
                padding: 12px;
            }

            .result-label {
                font-size: 13px;
            }

            .result-value {
                font-size: 18px;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 20px;
            }

            .schedule-table th,
            .schedule-table td {
                font-size: 12px;
                padding: 8px 4px;
            }

            #paymentChart {
                height: 200px !important;
            }
        }
    </style>
</head>
<body class="tool-page">
    <div class="container tool-page-shell">
        <header class="tool-page-header">
            <div class="tool-page-nav">
                <a href="../../index.html" class="back-to-home back-to-home--on-dark">
                    ← 返回主页
                </a>
            </div>
            <h1 class="tool-page-title">房贷计算器</h1>
            <p class="tool-page-subtitle">商业贷款、公积金贷款和组合贷款计算</p>
        </header>

        <div class="calculator-container">
            <div class="input-card">
                <div class="loan-type-selector" role="group" aria-label="贷款类型">
                    <button type="button" class="loan-type-button active" aria-pressed="true" data-loan-type="commercial">商业贷款</button>
                    <button type="button" class="loan-type-button" aria-pressed="false" data-loan-type="fund">公积金贷款</button>
                    <button type="button" class="loan-type-button" aria-pressed="false" data-loan-type="combined">组合贷款</button>
                </div>

                <!-- 商业贷款输入 -->
                <div id="commercial-inputs">
                    <div class="input-group">
                        <label for="commercialAmount">贷款总额</label>
                        <div class="input-addon" data-unit="万元">
                            <input type="number" id="commercialAmount" class="input-field" placeholder="请输入贷款金额" min="0.01" step="0.01">
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="commercialYears">贷款年限</label>
                        <div class="input-addon" data-unit="年">
                            <input type="number" id="commercialYears" class="input-field" placeholder="请输入贷款年限" min="1" max="100" step="1">
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="commercialRate">年利率</label>
                        <div class="input-addon" data-unit="%">
                            <input type="number" id="commercialRate" class="input-field" placeholder="请输入年利率" min="0" max="100" step="0.01">
                        </div>
                    </div>
                </div>

                <!-- 公积金贷款输入 -->
                <div id="fund-inputs" hidden>
                    <div class="input-group">
                        <label for="fundAmount">贷款总额</label>
                        <div class="input-addon" data-unit="万元">
                            <input type="number" id="fundAmount" class="input-field" placeholder="请输入贷款金额" min="0.01" step="0.01">
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="fundYears">贷款年限</label>
                        <div class="input-addon" data-unit="年">
                            <input type="number" id="fundYears" class="input-field" placeholder="请输入贷款年限" min="1" max="100" step="1">
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="fundRate">年利率</label>
                        <div class="input-addon" data-unit="%">
                            <input type="number" id="fundRate" class="input-field" placeholder="请输入年利率" min="0" max="100" step="0.01">
                        </div>
                    </div>
                </div>

                <!-- 组合贷款输入 -->
                <div id="combined-inputs" hidden>
                    <div class="input-group">
                        <label for="combinedCommercialAmount">商业贷款金额</label>
                        <div class="input-addon" data-unit="万元">
                            <input type="number" id="combinedCommercialAmount" class="input-field" placeholder="请输入商业贷款金额" min="0" step="0.01">
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="combinedCommercialRate">商业贷款年利率</label>
                        <div class="input-addon" data-unit="%">
                            <input type="number" id="combinedCommercialRate" class="input-field" placeholder="请输入商业贷款年利率" min="0" max="100" step="0.01">
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="combinedFundAmount">公积金贷款金额</label>
                        <div class="input-addon" data-unit="万元">
                            <input type="number" id="combinedFundAmount" class="input-field" placeholder="请输入公积金贷款金额" min="0" step="0.01">
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="combinedFundRate">公积金贷款年利率</label>
                        <div class="input-addon" data-unit="%">
                            <input type="number" id="combinedFundRate" class="input-field" placeholder="请输入公积金贷款年利率" min="0" max="100" step="0.01">
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="combinedYears">贷款年限</label>
                        <div class="input-addon" data-unit="年">
                            <input type="number" id="combinedYears" class="input-field" placeholder="请输入贷款年限" min="1" max="100" step="1">
                        </div>
                    </div>
                </div>

                <div class="input-group">
                    <label for="repaymentMethod">还款方式</label>
                    <select id="repaymentMethod" class="input-field">
                        <option value="equal">等额本息</option>
                        <option value="principal">等额本金</option>
                    </select>
                </div>

                <button type="button" class="calculate-button" id="calculate-mortgage-btn">计算还款明细</button>
            </div>

            <div class="result-card" hidden>
                <div class="result-summary">
                    <div class="result-item">
                        <div class="result-label">贷款总额</div>
                        <div class="result-value" id="totalLoan">0万元</div>
                    </div>
                    <div class="result-item">
                        <div class="result-label">总利息</div>
                        <div class="result-value" id="totalInterest">0万元</div>
                    </div>
                    <div class="result-item">
                        <div class="result-label">还款总额</div>
                        <div class="result-value" id="totalPayment">0万元</div>
                    </div>
                    <div class="result-item">
                        <div class="result-label">首月还款</div>
                        <div class="result-value" id="firstPayment">0元</div>
                    </div>
                </div>

                <div class="tab-container">
                    <div class="tab-buttons" role="tablist" aria-label="还款结果视图">
                        <button type="button" id="schedule-tab-button" class="tab-button active" role="tab" aria-selected="true" aria-controls="schedule-tab" data-tab="schedule">还款计划</button>
                        <button type="button" id="chart-tab-button" class="tab-button" role="tab" aria-selected="false" aria-controls="chart-tab" data-tab="chart">还款分析</button>
                    </div>

                    <div id="schedule-tab" role="tabpanel" aria-labelledby="schedule-tab-button">
                        <div class="table-container">
                            <table class="schedule-table">
                                <thead>
                                    <tr>
                                        <th>期数</th>
                                        <th>月供</th>
                                        <th>本金</th>
                                        <th>利息</th>
                                        <th>剩余本金</th>
                                    </tr>
                                </thead>
                                <tbody id="repaymentSchedule">
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div id="chart-tab" role="tabpanel" aria-labelledby="chart-tab-button" hidden>
                        <div class="chart-container" id="paymentChart"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"
            integrity="sha384-BQKzmHvQLMCAnL3UtDBA1Al5tFjsCz1wrMlIUA1wkzo14DYkRWjywW+p9pCj0cwd"
            crossorigin="anonymous"
            onerror="console.warn('图表库加载失败，统计图表不可用')"></script>
    <script src="../../utils/storage-keys.js"></script>
    <script src="../../utils/common.js"></script>
    <script src="../../utils/storage-service.js"></script>
    <script src="../../utils/dialog.js"></script>
    <script src="../../utils/form-import-export.js"></script>
    <script src="../../utils/finance-calculations.js"></script>
    <script src="mortgageCalculator.js"></script>
    <script>
        FormImportExport.init({
            pageId: 'mortgage-calculator',
            pageName: '房贷计算',
            storageKey: StorageKeys.MORTGAGE_CALCULATOR_DATA,
            rootSelector: '.calculator-container',
            inlineAfterSelector: '.header a[href="../../index.html"]',
            insertAfterSelector: '.header',
            collectSnapshot: () => window.MortgageCalculatorStorage.collectDraft(),
            applySnapshot: (draft) => window.MortgageCalculatorStorage.applyDraft(draft)
        });
    </script>
</body>
</html>
